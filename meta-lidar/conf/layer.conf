# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lidar"
BBFILE_PATTERN_meta-lidar = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lidar = "6"

LAYERDEPENDS_meta-lidar = "core"
LAYERSERIES_COMPAT_meta-lidar = "wrynose"
